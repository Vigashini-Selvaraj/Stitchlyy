<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | STITCHLY</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">

</head>
<body>

  <div class="auth-page">
    
    <!-- Image Side -->
    <div class="auth-image-side" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('assets/images/stitching.png');"></div>

    <!-- Form Side -->
    <div class="auth-form-side">
      <div class="auth-container">
        
        <a href="index.html" class="back-link">
          <i data-lucide="arrow-left"></i> Back to Home
        </a>

        <a href="index.html" class="auth-logo">
          <img src="assets/logoo1.png" alt="STITCHLY Logo" class="logo-light">
          <img src="assets/logoo1_dark.png" alt="STITCHLY Logo" class="logo-dark">
        </a>
        
        <h1>Create Your Account</h1>
        <p>Join STITCHLY and begin your personalized fashion journey.</p>
        


        <form id="registerForm">
          
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
              <label for="userEmail">Email Address</label>
              <input type="email" id="userEmail" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>
            
            <div class="form-group">
              <label for="userPassword">Password</label>
              <div class="password-wrapper">
                <input type="password" id="userPassword" placeholder="Create a password" required>
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                  <i data-lucide="eye" class="icon-eye"></i>
                  <i data-lucide="eye-off" class="icon-eye-off hidden-element"></i>
                </button>
              </div>
            </div>
            
            <div class="form-group">
              <label for="userConfirmPassword">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="userConfirmPassword" placeholder="Confirm your password" required>
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                  <i data-lucide="eye" class="icon-eye"></i>
                  <i data-lucide="eye-off" class="icon-eye-off hidden-element"></i>
                </button>
              </div>
            </div>
            
            <div class="form-group" style="display: flex; align-items: flex-start; gap: 10px; margin-top: 15px;">
              <input type="checkbox" id="terms" style="width: auto; margin-top: 4px;" required>
              <label for="terms" style="font-weight: 500; color: var(--color-text-secondary); font-size: 0.85rem; line-height: 1.4;">
                I agree to the Terms of Service & Privacy Policy
              </label>
            </div>

          <button type="submit" class="auth-submit-btn" id="registerBtnText">Create Account</button>
          
          <div class="social-divider">or continue with</div>
          <div class="social-login">
            <button type="button" class="btn-social">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width:20px;height:20px;">
              Google
            </button>
            <button type="button" class="btn-social">
              <i data-lucide="apple"></i>
              Apple
            </button>
          </div>
          
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>

      </div>
    </div>
  </div>

  <!-- Javascript -->
  <script src="js/auth.js"></script>

</body>
</html>
